<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07070c" />
    <meta name="description" content="Frazny — Digital Creator · Gaziantep. Kişisel bağlantılar ve profil." />
    <link rel="icon" type="image/jpeg" href="favicon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Frazny — links</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

      :root {
        color-scheme: dark;
        --bg: #07070c;
        --card: rgba(20, 20, 28, .72);
        --card-solid: #13131b;
        --border: rgba(255, 255, 255, .08);
        --border-strong: rgba(255, 255, 255, .14);
        --accent: #7c6cff;
        --accent-2: #22d3ee;
        --accent-3: #ff6ad5;
        --text: #f4f4f7;
        --muted: #9a9aa6;
        --muted-2: #6d6d78;
      }
      * { box-sizing: border-box; }
      html { scrollbar-color: #2a2a35 transparent; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, Arial, sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* ---- Arka plan: aurora + yıldızlar + gürültü ---- */
      .aurora { position: fixed; inset: 0; z-index: -2; overflow: hidden; background: var(--bg); }
      .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; will-change: transform; }
      .blob.b1 { width: 68vmax; height: 68vmax; background: radial-gradient(circle at 30% 30%, #7c6cff, transparent 62%); top: -22vmax; left: -12vmax; animation: floatA 20s ease-in-out infinite alternate; }
      .blob.b2 { width: 62vmax; height: 62vmax; background: radial-gradient(circle at 60% 40%, #22d3ee, transparent 62%); bottom: -26vmax; right: -16vmax; animation: floatA 24s ease-in-out infinite alternate-reverse; }
      .blob.b3 { width: 46vmax; height: 46vmax; background: radial-gradient(circle at 50% 50%, #ff6ad5, transparent 64%); top: 30%; left: 55%; opacity: .3; animation: floatA 28s ease-in-out infinite alternate; }
      @keyframes floatA { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(6vmax,-5vmax,0) scale(1.15); } }
      .stars {
        position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .6;
        background-image:
          radial-gradient(circle at 12% 23%, #bdb9ff 0 1px, transparent 1.6px),
          radial-gradient(circle at 78% 18%, #fff 0 1px, transparent 1.6px),
          radial-gradient(circle at 67% 76%, #8f86ff 0 1px, transparent 1.6px),
          radial-gradient(circle at 25% 82%, #fff 0 1px, transparent 1.6px),
          radial-gradient(circle at 88% 59%, #c7c3ff 0 1px, transparent 1.6px),
          radial-gradient(circle at 45% 40%, #fff 0 1px, transparent 1.6px);
        animation: drift 16s ease-in-out infinite alternate;
      }
      @keyframes drift { to { transform: translateY(-14px); } }
      .noise {
        position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: .04;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");
      }

      /* ---- Özel imleç ---- */
      @media (pointer: fine) {
        body.site-entered, body.site-entered a, body.site-entered button { cursor: none; }
        .cursor-dot, .cursor-ring { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999; border-radius: 50%; transform: translate(-50%, -50%); mix-blend-mode: difference; }
        .cursor-dot { width: 5px; height: 5px; background: #fff; }
        .cursor-ring { width: 28px; height: 28px; border: 1px solid rgba(255,255,255,.92); transition: width .18s ease, height .18s ease, border-color .18s ease; }
        body.cursor-link .cursor-ring { width: 44px; height: 44px; border-color: var(--accent); }
      }

      main { min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; position: relative; }

      .profile {
        width: min(620px, 100%);
        border-radius: 24px;
        padding: 36px 40px 30px;
        position: relative;
        overflow: hidden;
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(124,108,255,.04), inset 0 1px rgba(255,255,255,.03);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        animation: arrive .8s cubic-bezier(.2,.8,.2,1) both;
      }
      .profile::before {
        content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
        background: linear-gradient(130deg, rgba(124,108,255,.55), transparent 30%, transparent 70%, rgba(34,211,238,.45));
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude;
        pointer-events: none;
      }
      .profile::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 45%, rgba(255,255,255,.03), transparent 58%); transform: translateX(-100%); animation: sweep 6s ease-in-out infinite; }

      .identity { display: grid; justify-items: center; gap: 6px; text-align: center; position: relative; z-index: 1; }
      .avatar-wrap { position: relative; width: 84px; height: 84px; border-radius: 50%; padding: 3px; background: conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent)); box-shadow: 0 0 30px rgba(124,108,255,.35); animation: ring-spin 8s linear infinite; }
      .avatar-wrap::after { content:""; position:absolute; inset:3px; border-radius:50%; background:#07070c; }
      .avatar { position: relative; z-index: 1; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
      .status-dot { position: absolute; z-index: 2; right: 2px; bottom: 2px; width: 15px; height: 15px; border-radius: 50%; background: #4cd36e; border: 3px solid #0c0c12; box-shadow: 0 0 12px #4cd36e; }
      @keyframes ring-spin { to { transform: rotate(360deg); } }

      h1 {
        margin: 14px 0 0; font-family: 'Space Grotesk', Inter, sans-serif;
        font-size: clamp(34px, 6vw, 48px); font-weight: 700; letter-spacing: -.04em; line-height: 1;
        background: linear-gradient(90deg, #fff 0%, #d6d0ff 45%, #8f86ff 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        text-shadow: 0 0 40px rgba(124,108,255,.25);
      }
      .bio { color: var(--muted); font-size: 13px; margin: 8px 0 0; letter-spacing: .01em; }
      .bio .loc { color: var(--muted-2); }

      .links { display: flex; justify-content: center; gap: 10px; margin-top: 22px; position: relative; z-index: 1; flex-wrap: wrap; }
      .links a {
        width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px;
        color: #d4d4d8; text-decoration: none; border: 1px solid var(--border-strong);
        background: rgba(255,255,255,.03); transition: .22s ease; position: relative;
      }
      .links a svg { opacity: .85; transition: opacity .2s ease; }
      .links a:hover { transform: translateY(-3px); border-color: var(--accent); background: rgba(124,108,255,.12); color: #fff; box-shadow: 0 8px 22px rgba(124,108,255,.25); }
      .links a:hover svg { opacity: 1; }
      .links a:nth-child(1):hover { color:#e24990; border-color:#e24990; background:rgba(226,73,144,.12); box-shadow:0 8px 22px rgba(226,73,144,.25); }
      .links a:nth-child(2):hover { color:#40d26d; border-color:#40d26d; background:rgba(64,210,109,.12); box-shadow:0 8px 22px rgba(64,210,109,.25); }
      .links a:nth-child(3):hover { color:#f0f0f0; border-color:#f0f0f0; background:rgba(255,255,255,.1); box-shadow:0 8px 22px rgba(255,255,255,.15); }
      .links a:nth-child(4):hover { color:#7289da; border-color:#7289da; background:rgba(114,137,218,.12); box-shadow:0 8px 22px rgba(114,137,218,.25); }
      .links a:nth-child(5):hover { color:#70a8ff; border-color:#70a8ff; background:rgba(112,168,255,.12); box-shadow:0 8px 22px rgba(112,168,255,.25); }
      .links a:nth-child(6):hover { color:#ea4335; border-color:#ea4335; background:rgba(234,67,53,.12); box-shadow:0 8px 22px rgba(234,67,53,.25); }

      .divider { height: 1px; margin: 22px 0; background: linear-gradient(90deg, transparent, var(--border-strong), transparent); position: relative; z-index: 1; }

      .copy-btn {
        appearance: none; width: 100%; border: 1px solid var(--border-strong); border-radius: 12px; padding: 12px;
        color: #b9b9c4; background: rgba(255,255,255,.03); font: 12px 'DM Mono', monospace; transition: .2s ease; position: relative; z-index: 1; cursor: pointer;
      }
      .copy-btn:hover { color: #fff; border-color: var(--accent); background: rgba(124,108,255,.12); }

      .now-playing { position: relative; z-index: 1; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); background: rgba(10,10,14,.7); }
      .now-playing-label { display: flex; align-items: center; gap: 6px; padding: 10px 14px 6px; color: var(--muted); font: 10px 'DM Mono', monospace; letter-spacing: .06em; text-transform: uppercase; }
      .now-playing-label::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #1db954; box-shadow: 0 0 8px #1db954; animation: pulse 2s ease-in-out infinite; }
      .audio-player { padding: 8px 14px 14px; }
      .audio-info { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; }
      .audio-title { color: var(--text); font-size: 14px; font-weight: 600; }
      .audio-artist { color: var(--muted); font: 11px 'DM Mono', monospace; }
      .audio-controls { display: flex; align-items: center; gap: 12px; }
      .play-btn { width: 34px; height: 34px; border-radius: 50%; background: #1db954; border: none; color: #000; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; transition: .2s ease; }
      .play-btn:hover { background: #1ed760; transform: scale(1.08); box-shadow: 0 0 18px rgba(29,185,84,.5); }
      .progress-wrap { flex: 1; height: 5px; background: #23232b; border-radius: 5px; cursor: pointer; position: relative; overflow: hidden; }
      .progress-bar { height: 100%; background: linear-gradient(90deg,#1db954,#3ce07e); border-radius: 5px; width: 0%; transition: width .1s linear; }
      .audio-time { color: var(--muted); font: 11px 'DM Mono', monospace; flex-shrink: 0; min-width: 34px; text-align: right; }

      .extras { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; position: relative; z-index: 1; }
      .mini-card { min-height: 66px; border: 1px solid var(--border); border-radius: 14px; padding: 13px 14px; background: rgba(255,255,255,.02); color: #d0d0d8; text-decoration: none; transition: .22s ease; }
      .mini-card:hover { border-color: var(--accent); transform: translateY(-3px); background: rgba(124,108,255,.08); box-shadow: 0 10px 26px rgba(124,108,255,.18); }
      .mini-title { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 13px; font-weight: 600; }
      .mini-copy { margin-top: 6px; color: var(--muted); font: 11px 'DM Mono', monospace; }
      .status-dot.idle { background:#b7a653; box-shadow:0 0 10px #b7a653; }

      .views { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 18px; color: #e8e8eb; font: 600 12px 'DM Mono', monospace; }
      .eye { width: 18px; height: 12px; border: 2px solid currentColor; border-radius: 100%; position: relative; opacity:.7; } .eye::after { content:""; position:absolute; width:4px; height:4px; border-radius:50%; background:currentColor; top:50%; left:50%; transform:translate(-50%,-50%); }

      /* ---- Canlı durum (Discord + Spotify) ---- */
      .live-status { position: relative; z-index: 1; display: grid; gap: 10px; margin-top: 22px; }
      .live-card {
        position: relative; overflow: hidden; display: flex; align-items: center; gap: 14px;
        padding: 14px 15px; border-radius: 16px; border: 1px solid var(--border);
        background: rgba(255,255,255,.02); transition: border-color .25s ease, transform .25s ease;
      }
      .live-card::before { content:""; position:absolute; inset:0; opacity:0; transition: opacity .35s ease; pointer-events:none; }
      .live-card:hover { transform: translateY(-2px); }
      .live-card.discord::before { background: radial-gradient(120% 120% at 0% 0%, rgba(114,137,218,.16), transparent 60%); }
      .live-card.spotify::before { background: radial-gradient(120% 120% at 100% 0%, rgba(29,185,84,.14), transparent 60%); }
      .live-card:hover::before { opacity: 1; }

      .dot-wrap { position: relative; width: 13px; height: 13px; display: grid; place-items: center; flex-shrink: 0; }
      .live-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dot-color, #5d5d65); box-shadow: 0 0 10px var(--dot-color, #5d5d65); transition: background .3s ease; }
      .dot-wrap.online::after { content:""; position:absolute; inset:0; border-radius:50%; border:2px solid var(--dot-color); animation: ping 1.8s ease-out infinite; }
      @keyframes ping { 0% { transform: scale(.4); opacity:1; } 100% { transform: scale(2); opacity:0; } }

      .brand-ic { width: 12px; height: 12px; color: #7289da; flex-shrink: 0; }
      .live-card.spotify .brand-ic { color: #1db954; }
      .dc-avatar-wrap { position: relative; width: 42px; height: 42px; flex-shrink: 0; }
      .dc-avatar { width: 100%; height: 100%; border-radius: 12px; object-fit: cover; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
      .dc-avatar-wrap .dot-wrap { position: absolute; right: -3px; bottom: -3px; width: 14px; height: 14px; background: #0c0c12; border-radius: 50%; display: grid; place-items: center; }

      .live-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
      .live-label-row { display: flex; align-items: center; gap: 7px; }
      .live-label { color: var(--muted-2); font: 10px 'DM Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
      .live-value { color: var(--text); font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .live-sub { color: var(--muted); font: 11px 'DM Mono', monospace; }

      .marquee { overflow: hidden; white-space: nowrap; }
      .marquee span { display: inline-block; white-space: nowrap; }
      .marquee.scroll span { animation: marquee 14s linear infinite; }
      @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

      .spotify-art { width: 46px; height: 46px; border-radius: 10px; object-fit: cover; flex-shrink: 0; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
      .spotify-art.playing { animation: artGlow 2.6s ease-in-out infinite; }
      @keyframes artGlow { 0%,100% { box-shadow: 0 6px 18px rgba(0,0,0,.5), 0 0 14px rgba(29,185,84,.25); } 50% { box-shadow: 0 6px 18px rgba(0,0,0,.5), 0 0 30px rgba(29,185,84,.55); } }

      .eq { display: flex; align-items: flex-end; gap: 2px; height: 11px; }
      .eq span { width: 3px; border-radius: 2px; background: #1db954; animation: eq 1s ease-in-out infinite; }
      .eq span:nth-child(2) { animation-delay: .18s; }
      .eq span:nth-child(3) { animation-delay: .36s; }
      @keyframes eq { 0%,100% { height: 3px; } 50% { height: 11px; } }

      .spotify-progress { height: 4px; background: #23232b; border-radius: 4px; margin-top: 7px; overflow: hidden; position: relative; }
      .spotify-progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg,#1db954,#3ce07e); border-radius: 4px; }
      .spotify-progress::after { content:""; position:absolute; inset:0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent); transform: translateX(-100%); }
      .spotify-progress.playing::after { animation: shimmer 2.2s ease-in-out infinite; }
      @keyframes shimmer { 0% { transform: translateX(-100%); } 60%,100% { transform: translateX(100%); } }

      footer { position: relative; z-index: 1; text-align: center; margin-top: 22px; color: var(--muted-2); font: 11px 'DM Mono', monospace; }
      footer a { color: var(--muted); text-decoration: none; transition: .2s; }
      footer a:hover { color: var(--accent); }
      footer .sep { margin: 0 8px; opacity:.5; }

      .hint { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); color: var(--muted-2); font: 11px 'DM Mono',monospace; letter-spacing:.06em; animation: fade 1s 1s both; }

      /* ---- Giriş ekranı ---- */
      .entry-screen {
        position: fixed; inset: 0; z-index: 10000;
        background: radial-gradient(120% 120% at 50% 0%, #14141f 0%, #07070c 60%);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        cursor: pointer; transition: opacity .6s ease, transform .6s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .entry-screen.hide { opacity: 0; pointer-events: none; transform: scale(1.04); }
      .entry-avatar-wrap { width: 84px; height: 84px; border-radius: 50%; padding: 3px; background: conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent)); box-shadow: 0 0 40px rgba(124,108,255,.4); animation: ring-spin 8s linear infinite; }
      .entry-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
      .entry-name { font-family: 'Space Grotesk', Inter, sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -.03em; background: linear-gradient(90deg,#fff,#d6d0ff,#8f86ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
      .entry-music { display: flex; align-items: center; gap: 8px; color: var(--muted); font: 11px 'DM Mono', monospace; }
      .entry-music::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #1db954; box-shadow: 0 0 8px #1db954; display: inline-block; animation: pulse 2s ease-in-out infinite; }
      .entry-hint { color: var(--muted-2); font: 11px 'DM Mono', monospace; letter-spacing: .1em; animation: pulse 2s ease-in-out infinite; }
      .entry-browser-note { color: #3d3d44; font: 10px 'DM Mono', monospace; }

      @keyframes pulse { 0%,100% { opacity:.4; } 50% { opacity:1; } }
      @keyframes arrive { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }
      @keyframes sweep { 0%,70% { transform:translateX(-115%); } 100% { transform:translateX(115%); } }
      @keyframes fade { to { opacity:1; } } .hint { opacity:0; }

      @media (max-width: 480px) {
        .profile { padding: 30px 22px; }
        .extras { grid-template-columns: 1fr; }
        .links { gap: 8px; }
        .links a { width: 38px; height: 38px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .blob, .stars, .profile::after, .avatar-wrap, .entry-avatar-wrap, h1 { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div class="aurora" aria-hidden="true">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
    </div>
    <div class="stars" aria-hidden="true"></div>
    <div class="noise" aria-hidden="true"></div>
    <div class="cursor-dot" aria-hidden="true"></div>
    <div class="cursor-ring" aria-hidden="true"></div>

    <!-- Giriş ekranı -->
    <div class="entry-screen" id="entry-screen" role="button" aria-label="Siteye gir">
      <div class="entry-avatar-wrap"><img class="entry-avatar" src="profile.jpg" alt="Frazny" /></div>
      <span class="entry-name">Frazny</span>
      <span class="entry-music">Mist — EsDeeKid ft. Rico Ace</span>
      <span class="entry-hint">girmek için tıkla</span>
      <span class="entry-browser-note">müzik için tarayıcıda aç</span>
    </div>

    <main>
      <section class="profile" aria-label="Profil kartı">
        <div class="identity">
          <div class="avatar-wrap">
            <img class="avatar" src="profile.jpg" alt="Frazny profil fotoğrafı" />
            <span class="status-dot" title="Çevrimiçi"></span>
          </div>
          <h1 id="typewriter"></h1>
          <p class="bio">Digital Creator · <span class="loc">Gaziantep</span></p>
        </div>

        <div class="live-status" aria-label="Canlı durum">
          <div class="live-card discord">
            <div class="dc-avatar-wrap">
              <img class="dc-avatar" id="dc-avatar" src="profile.jpg" alt="Discord profil fotoğrafı" />
              <span class="dot-wrap" id="discord-dot-wrap"><span class="live-dot" id="discord-dot"></span></span>
            </div>
            <div class="live-text">

    <script>
      // Yıl
      document.getElementById('year').textContent = new Date().getFullYear();

      // ---- Canlı durum: Discord + Spotify (Lanyard) ----
      // 👉 Aşağıya kendi Discord kullanıcı ID'nizi yazın (sağ alttaki ayarlar > Gelişmiş > Geliştirici modu > profilinize sağ tık > Kopyala ID)
      const DISCORD_ID = '780466364636332062';
      let lastSeen = parseInt(localStorage.getItem('lanyard_lastseen') || '0', 10);

      function fmtAgo(ts) {
        const s = Math.max(1, Math.round((Date.now() - ts) / 1000));
        if (s < 60) return s + ' sn önce';
        const m = Math.round(s / 60);
        if (m < 60) return m + ' dk önce';
        const h = Math.round(m / 60);
        if (h < 24) return h + ' sa önce';
        return Math.round(h / 24) + ' gün önce';
      }

      function updateLanyard(data) {
        const status = data.discord_status || 'offline'; // online / idle / dnd / offline
        const dotWrap = document.getElementById('discord-dot-wrap');
        const statusEl = document.getElementById('discord-status');
        const cardDot = document.getElementById('discord-card-dot');
        const cardCopy = document.getElementById('discord-card-copy');

        if (status !== 'offline') {
          lastSeen = Date.now();
          localStorage.setItem('lanyard_lastseen', String(lastSeen));
        }

        // Discord profil fotoğrafı (canlı)
        const du = data.discord_user;
        if (du && du.avatar) {
          document.getElementById('dc-avatar').src = 'https://cdn.discordapp.com/avatars/' + du.id + '/' + du.avatar + '.png?size=128';
        }

        const map = {
          online: ['Çevrimiçi', '#4cd36e'],
          idle: ['Boşta', '#f0b429'],
          dnd: ['Rahatsız etmeyin', '#f04747'],
          offline: ['Çevrimdışı', '#5d5d65']
        };
        const [label, color] = map[status] || map.offline;
        dotWrap.style.setProperty('--dot-color', color);
        dotWrap.classList.toggle('online', status !== 'offline');
        cardDot.style.background = color;
        cardDot.style.boxShadow = '0 0 10px ' + color;
        cardDot.classList.remove('idle');

        if (status === 'offline') {
          statusEl.textContent = lastSeen ? 'Son görülme: ' + fmtAgo(lastSeen) : 'Çevrimdışı';
          cardCopy.textContent = lastSeen ? 'Son görülme: ' + fmtAgo(lastSeen) : 'Bağlantıyı aç';
        } else {
          statusEl.textContent = label;
          cardCopy.textContent = 'Bağlantıyı aç';
        }

        // Spotify: aktivite tipi 2 = Dinleniyor
        const spot = data.activities && data.activities.find(a => a.type === 2 && a.name === 'Spotify');
        const art = document.getElementById('spotify-art');
        const eq = document.getElementById('eq');
        const spotStatus = document.getElementById('spotify-status');
        const titleWrap = document.getElementById('spotify-title');
        const titleInner = document.getElementById('spotify-title-inner');
        const artistEl = document.getElementById('spotify-artist');
        const progWrap = document.getElementById('spotify-progress-wrap');
        const progBar = document.getElementById('spotify-progress-bar');

        if (spot && spot.assets) {
          art.src = spot.assets.large_image.replace('spotify:', 'https://i.scdn.co/image/');
          art.hidden = false;
          art.classList.add('playing');
          eq.hidden = false;
          spotStatus.hidden = true;
          // Uzun başlıklar için kayan (marquee) animasyon
          if (spot.details.length > 18) {
            titleInner.textContent = spot.details + '   ✦   ' + spot.details;
            titleWrap.classList.add('scroll');
          } else {
            titleInner.textContent = spot.details;
            titleWrap.classList.remove('scroll');
          }
          titleWrap.hidden = false;
          artistEl.textContent = spot.state;
          artistEl.hidden = false;
          progWrap.hidden = false;
          progWrap.classList.add('playing');
          const total = (spot.timestamps.end - spot.timestamps.start) / 1000;
          const elapsed = (Date.now() - spot.timestamps.start) / 1000;
          progBar.style.width = Math.min(100, (elapsed / total) * 100) + '%';
        } else {
          art.hidden = true;
          art.classList.remove('playing');
          eq.hidden = true;
          spotStatus.hidden = false;
          spotStatus.textContent = 'şu an müzik dinlemiyor';
          titleWrap.hidden = true;
          titleWrap.classList.remove('scroll');
          artistEl.hidden = true;
          progWrap.hidden = true;
          progWrap.classList.remove('playing');
        }
      }

      async function pollLanyard() {
        if (!DISCORD_ID || DISCORD_ID === 'YOUR_DISCORD_ID') return;
        try {
          const res = await fetch('https://api.lanyard.rest/v1/users/' + DISCORD_ID);
          const json = await res.json();
          if (json.success && json.data) updateLanyard(json.data);
        } catch (e) { /* sessizce geç */ }
      }
      pollLanyard();
      setInterval(pollLanyard, 30000);

      // Ziyaretçi sayacı
      fetch('https://frazny-counter.yusufakbulit.workers.dev/')
        .then(r => r.json())
        .then(data => { document.querySelector('#views').textContent = String(data.count).padStart(3, '0'); })
        .catch(() => { document.querySelector('#views').textContent = '001'; });

      // Kopyala butonu
      document.querySelector('#copy-name').addEventListener('click', async () => {
        await navigator.clipboard.writeText('fraznybusiness@gmail.com');
        const btn = document.querySelector('#copy-name');
        btn.textContent = 'Kopyalandı ✓';
        setTimeout(() => btn.textContent = 'fraznybusiness@gmail.com', 1700);
      });

      // Sekme başlığı typewriter + pulse
      const titleText = 'Frazny';
      let tIdx = 0;
      function titleType() {
        document.title = titleText.slice(0, tIdx) + '|';
        tIdx++;
        if (tIdx <= titleText.length) { setTimeout(titleType, 130); }
        else { setTimeout(titlePulse, 800); }
      }
      function titlePulse() {
        const frames = ['Frazny ✦', 'Frazny ✧', 'Frazny ✦', 'Frazny'];
        let i = 0;
        (function next() {
          document.title = frames[i++];
          if (i < frames.length) setTimeout(next, 400);
          else setTimeout(() => { tIdx = 0; titleType(); }, 2000);
        })();
      }
      titleType();

      // Sayfa içi typewriter
      const typeEl = document.getElementById('typewriter');
      let pIdx = 0;
      function typeWriter() {
        typeEl.textContent = 'Frazny'.slice(0, pIdx);
        if (pIdx <= 6) { pIdx++; setTimeout(typeWriter, 120); }
      }
      setTimeout(typeWriter, 400);

      // Audio player
      const audio = document.getElementById('audio');
      const playBtn = document.getElementById('play-btn');
      const iconPlay = document.getElementById('icon-play');
      const iconPause = document.getElementById('icon-pause');
      const progressBar = document.getElementById('progress-bar');
      const progressWrap = document.getElementById('progress-wrap');
      const audioTime = document.getElementById('audio-time');

      function fmt(s) { return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); }
      function setPlaying(p) { iconPlay.style.display = p ? 'none' : 'block'; iconPause.style.display = p ? 'block' : 'none'; }

      audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
          progressBar.style.width = (audio.currentTime / audio.duration * 100) + '%';
          audioTime.textContent = fmt(audio.currentTime);
        }
      });
      audio.addEventListener('ended', () => setPlaying(false));
      playBtn.addEventListener('click', () => {
        if (audio.paused) { audio.play(); setPlaying(true); }
        else { audio.pause(); setPlaying(false); }
      });
      progressWrap.addEventListener('click', e => {
        const r = progressWrap.getBoundingClientRect();
        audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
      });

      // Giriş ekranı
      const entryScreen = document.getElementById('entry-screen');
      audio.load();

      let entered = false;
      function enterSite() {
        if (entered) return;
        entered = true;
        entryScreen.classList.add('hide');
        document.body.classList.add('site-entered');
        setTimeout(() => { if (entryScreen.parentNode) entryScreen.remove(); }, 650);
        audio.play().then(() => setPlaying(true)).catch(() => {});
      }

      entryScreen.addEventListener('click', enterSite);
      entryScreen.addEventListener('touchend', enterSite, { passive: true });
      document.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') enterSite(); });

      // Custom cursor (sadece giriş sonrası)
      if (matchMedia('(pointer: fine)').matches) {
        const dot = document.querySelector('.cursor-dot');
        const ring = document.querySelector('.cursor-ring');
        let mx = innerWidth/2, my = innerHeight/2, rx = mx, ry = my;
        addEventListener('mousemove', e => {
          mx = e.clientX; my = e.clientY;
          dot.style.left = mx+'px'; dot.style.top = my+'px';
        });
        document.querySelectorAll('a, button').forEach(el => {
          el.addEventListener('mouseenter', () => document.body.classList.add('cursor-link'));
          el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-link'));
        });
        (function animCursor() {
          rx += (mx-rx)*.16; ry += (my-ry)*.16;
          ring.style.left = rx+'px'; ring.style.top = ry+'px';
          requestAnimationFrame(animCursor);
        })();
      }
    </script>
  </body>
</html>
